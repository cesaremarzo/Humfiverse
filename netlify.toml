[build]
  # angular.json's outputPath is set to "../docs" with baseHref "/Humfiverse/"
  # (needed for GitHub Pages, which serves this repo from a /Humfiverse/
  # subpath). Netlify serves from the domain root, so that baseHref is wrong
  # here — every asset request 404s even though index.html itself deploys
  # fine (this was the actual cause of the reported 404). --base-href=/
  # overrides it for this build only; it never touches the docs/ folder
  # committed to git for GitHub Pages.
  command = "cd webapp && npm ci && npx ng build --base-href=/"
  publish = "docs"

[build.environment]
  # Angular 22 needs a recent Node — Netlify's own default can be older.
  NODE_VERSION = "22.12.0"

[[redirects]]
  # Safety net: the app uses hash-based routing (#/marketplace, etc.), so
  # every real navigation already stays on index.html and this shouldn't
  # normally trigger — but it protects any direct/non-hash path from 404ing.
  from = "/*"
  to = "/index.html"
  status = 200
