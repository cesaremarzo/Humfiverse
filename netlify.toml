[build]
  # angular.json's baseHref is "/" since the site moved to humfiverse.com
  # (§2.109); it used to be "/Humfiverse/" for the GitHub Pages subpath,
  # which made every asset 404 here. --base-href=/ is kept explicit so a
  # future change to angular.json can't silently break preview deploys.
  command = "cd webapp && npm ci && npx ng build --base-href=/"
  publish = "docs"

[build.environment]
  # Angular 22's toolchain needs Node ^22.22.3 || ^24.15.0 || >=26.0.0 —
  # pinning only the major (not a specific patch) so Netlify always uses
  # the latest 22.x patch, which satisfies that range (a fixed "22.12.0"
  # didn't, caught via EBADENGINE warnings in a real Netlify build log).
  NODE_VERSION = "22"
  # Without this, the Angular CLI's first-run "share anonymous usage
  # data?" prompt blocks waiting for stdin on Netlify's non-interactive
  # build — the build log just stops dead right after printing the build
  # command, with no error (caught live: this was exactly what happened).
  NG_CLI_ANALYTICS = "false"

[[redirects]]
  # Safety net: the app uses hash-based routing (#/marketplace, etc.), so
  # every real navigation already stays on index.html and this shouldn't
  # normally trigger — but it protects any direct/non-hash path from 404ing.
  from = "/*"
  to = "/index.html"
  status = 200
