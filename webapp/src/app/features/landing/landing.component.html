<div style="position:relative; isolation:isolate; overflow:hidden; min-height:calc(100vh - 260px); display:flex; align-items:center; justify-content:center;">
  <svg
    width="1600" height="1600" viewBox="0 0 120 120"
    style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); opacity:0.16; pointer-events:none; z-index:0;"
    aria-hidden="true">
    <line x1="16" y1="55" x2="16" y2="65" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round" opacity="0.4"/>
    <line x1="27" y1="44.7" x2="27" y2="75.3" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="38" y1="35.9" x2="38" y2="84.1" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="49" y1="30.1" x2="49" y2="90.0" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round" opacity="0.95"/>
    <line x1="60" y1="28" x2="60" y2="92" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round"/>
    <line x1="71" y1="30.1" x2="71" y2="90.0" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round" opacity="0.95"/>
    <line x1="82" y1="35.9" x2="82" y2="84.1" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="93" y1="44.7" x2="93" y2="75.3" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="104" y1="55" x2="104" y2="65" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round" opacity="0.4"/>
  </svg>

  <div style="position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; text-align:center; gap:28px; padding:40px 20px; max-width:640px;">
    <svg width="88" height="88" viewBox="0 0 120 120" aria-hidden="true">
      <line x1="16" y1="55" x2="16" y2="65" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round" opacity="0.4"/>
      <line x1="27" y1="44.7" x2="27" y2="75.3" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round" opacity="0.6"/>
      <line x1="38" y1="35.9" x2="38" y2="84.1" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round" opacity="0.8"/>
      <line x1="49" y1="30.1" x2="49" y2="90.0" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round" opacity="0.95"/>
      <line x1="60" y1="28" x2="60" y2="92" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round"/>
      <line x1="71" y1="30.1" x2="71" y2="90.0" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round" opacity="0.95"/>
      <line x1="82" y1="35.9" x2="82" y2="84.1" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round" opacity="0.8"/>
      <line x1="93" y1="44.7" x2="93" y2="75.3" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round" opacity="0.6"/>
      <line x1="104" y1="55" x2="104" y2="65" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round" opacity="0.4"/>
    </svg>

    <div>
      <h1 style="font-size:clamp(34px,5vw,52px); letter-spacing:-0.01em;">Humfiverse</h1>
      <p class="page-sub" style="margin-top:14px; font-size:16px; max-width:52ch;">{{ 'landing.tagline' | translate }}</p>
    </div>

    <div style="display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:8px;">
      <button type="button" class="btn btn-primary btn-lg" (click)="choose('artist')">{{ 'landing.artistBtn' | translate }}</button>
      <button type="button" class="btn btn-secondary btn-lg" (click)="choose('investor')">{{ 'landing.investorBtn' | translate }}</button>
    </div>
  </div>
</div>
