@if (asset; as a) {
  <div class="card campaign-card">
    <div class="campaign-head">
      <div style="display:flex; gap:12px;">
        <div class="campaign-cover" [style.background]="bg()"></div>
        <div>
          <div class="asset-title" style="font-size:16px;">{{ a.title }}</div>
          <div class="asset-artist">{{ a.artistName }}</div>
        </div>
      </div>
      <app-status-chip [asset]="a"></app-status-chip>
    </div>
    <div>
      <div class="meter"><span [style.width.%]="pct()"></span></div>
      <div class="asset-meta-row" style="margin-top:6px;">
        <span>{{ 'asset.ofGoal' | translate: { raised: raisedShort(), goal: goalShort() } }}</span>
        <span class="value">{{ pct() }}%</span>
      </div>
    </div>
    @if (a.milestones) {
      <app-milestone-track [milestones]="a.milestones"></app-milestone-track>
    }
    <div style="display:flex; justify-content:space-between; align-items:center; padding-top:4px;">
      <span style="font-size:12.5px; color:var(--text-secondary); display:flex; align-items:center; gap:6px;"><app-icon name="users"></app-icon> {{ 'campaignCard.tokenHolders' | translate: { n: campaign.holders } }}</span>
      <a class="btn btn-secondary btn-sm" [routerLink]="['/asset', a.id]">{{ 'campaignCard.viewListing' | translate }} <app-icon name="arrowRight"></app-icon></a>
    </div>
  </div>
}
