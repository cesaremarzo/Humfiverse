<div class="bd-orb bd-orb--a"></div>
<div class="bd-orb bd-orb--b"></div>
<div class="bd-orb bd-orb--c"></div>
<div class="bd-grid"></div>

<!-- Coins at different depths: the far ones soft, the nearest out of focus -->
@for (c of floatingCoins; track $index) {
  <img [class]="'bd-coin bd-coin--' + c.depth" [src]="c.tilt ? 'assets/art/coin-tilt.webp' : 'assets/art/coin.webp'" alt=""
    [style.left.%]="c.x" [style.top.%]="c.y" [style.width.px]="c.size" [style.--rot]="c.rot + 'deg'" [style.animation-delay.ms]="$index * -2300" />
}

<svg class="bd-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <linearGradient id="bd-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--accent-ink)" stop-opacity="0" />
      <stop offset="0.25" stop-color="var(--accent-ink)" />
      <stop offset="0.75" stop-color="var(--accent-2)" />
      <stop offset="1" stop-color="var(--accent-2)" stop-opacity="0" />
    </linearGradient>
    <!-- Candles in glass: lit edge on the left, a dark core, a thin rim on the right -->
    <linearGradient id="bd-candle-up" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--accent-2)" stop-opacity="0.75" />
      <stop offset="0.22" stop-color="var(--accent-2)" stop-opacity="0.28" />
      <stop offset="0.7" stop-color="var(--accent-2)" stop-opacity="0.12" />
      <stop offset="1" stop-color="var(--accent-2)" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="bd-candle-down" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--accent-ink)" stop-opacity="0.7" />
      <stop offset="0.22" stop-color="var(--accent-ink)" stop-opacity="0.26" />
      <stop offset="0.7" stop-color="var(--accent-ink)" stop-opacity="0.1" />
      <stop offset="1" stop-color="var(--accent-ink)" stop-opacity="0.4" />
    </linearGradient>
    <filter id="bd-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.55" />
    </filter>
    <linearGradient id="bd-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--accent-2)" stop-opacity="0.14" />
      <stop offset="0.6" stop-color="var(--accent-2)" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Stave whose note heads are coins -->
  <g class="bd-staff">
    @for (d of staff; track $index) {
      <path [attr.d]="d" />
    }
    @for (n of notes; track $index) {
      <g class="bd-note" [attr.transform]="'translate(' + n.x + ' ' + n.y + ')'" [style.animation-delay.ms]="$index * -700">
        <line x1="10" y1="-2" x2="10" [attr.y2]="-n.stem" />
        <image href="assets/art/coin-tilt.webp" x="-13" y="-8" width="26" height="16" />
      </g>
    }
  </g>

  <!-- Record with a funding gauge for a rim -->
  <g class="bd-vinyl" transform="translate(1210 230)">
    <!-- The grooves are round, so only the label visibly turns; the highlight stays with the light -->
    <image href="assets/art/vinyl.webp" x="-158" y="-158" width="316" height="316" filter="url(#bd-shadow)" />
    <image href="assets/art/vinyl-label.webp" x="-158" y="-158" width="316" height="316" class="bd-vinyl-spin" />
    @for (t of ticks; track t) {
      <line x1="0" y1="-182" x2="0" [attr.y2]="$index % 4 === 0 ? -192 : -187" [attr.transform]="'rotate(' + t + ')'" class="bd-tick" />
    }
    <circle r="168" class="bd-gauge-track" />
    <circle r="168" class="bd-gauge" transform="rotate(-90)"
      [attr.stroke-dasharray]="gaugeLen * gaugeFill + ' ' + gaugeLen" />
  </g>

  <!-- Spectrum that reads as an order book -->
  <g class="bd-spectrum" transform="translate(0 420)">
    @for (b of spectrum; track $index) {
      <rect [attr.x]="b.x" [attr.y]="-b.h" width="7" [attr.height]="b.h * 2" rx="3.5" [style.animation-delay.ms]="b.delay" />
    }
  </g>

  <!-- Candles breathing like an equaliser -->
  <g class="bd-candles">
    @for (c of candles; track $index) {
      <g [class.up]="c.up" [style.animation-delay.ms]="c.delay">
        <line [attr.x1]="c.x" [attr.x2]="c.x" [attr.y1]="c.wickTop" [attr.y2]="c.wickBottom" />
        <rect [attr.x]="c.x - 7" [attr.y]="c.body" width="14" [attr.height]="c.h" rx="3" [attr.fill]="c.up ? 'url(#bd-candle-up)' : 'url(#bd-candle-down)'" />
        <rect [attr.x]="c.x - 4.5" [attr.y]="c.body + 2" width="2" [attr.height]="c.h > 10 ? c.h - 4 : 0" rx="1" class="bd-candle-shine" />
      </g>
    }
  </g>

  <!-- A price line that is also a sound wave -->
  <path [attr.d]="waveArea" fill="url(#bd-area)" class="bd-area" />
  <path [attr.d]="waveEcho" class="bd-wave-echo" />
  <path [attr.d]="wave" class="bd-wave-glow" />
  <path [attr.d]="wave" class="bd-wave" pathLength="1" />

  @for (l of labels; track $index) {
    <text [attr.x]="l.x" [attr.y]="l.y" class="bd-label-text">{{ l.t }}</text>
  }
</svg>

<div class="bd-fade"></div>
<!-- Inline so the URL resolves against the base href (/Humfiverse/ on Pages) -->
<div class="bd-grain" style="background-image: url(assets/art/grain.webp)"></div>
