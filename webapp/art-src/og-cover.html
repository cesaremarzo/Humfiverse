<!doctype html>
<!-- Source of public/assets/og-cover.png (1200x630). Screenshot it at that size:
     node og-shot.mjs   (or open it and capture the .card element) -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E0D0C;
    --text: #F1ECE3;
    --text-secondary: #A89E8F;
    --accent: #7D56BC;
    --accent-ink: #C4A6EC;
    --accent-2: #3FD2BE;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--bg);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    color: var(--text);
  }
  .orb { position: absolute; border-radius: 50%; }
  .orb--a { width: 900px; height: 900px; left: -320px; top: -420px; background: radial-gradient(closest-side, rgba(125,86,188,0.40), transparent); }
  .orb--b { width: 800px; height: 800px; right: -260px; top: 120px; background: radial-gradient(closest-side, rgba(63,210,190,0.20), transparent); }
  .orb--c { width: 600px; height: 600px; left: 180px; bottom: -380px; background: radial-gradient(closest-side, rgba(217,178,106,0.14), transparent); }
  .grain { position: absolute; inset: 0; background: url(../public/assets/art/grain.webp) repeat; background-size: 180px; mix-blend-mode: overlay; opacity: 0.07; }
  .vinyl { position: absolute; right: -90px; top: 50px; width: 520px; height: 520px; filter: drop-shadow(0 30px 40px rgba(0,0,0,0.6)); }
  .vinyl img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .coin { position: absolute; filter: drop-shadow(0 16px 18px rgba(0,0,0,0.5)); }
  .coin--1 { width: 118px; left: 120px; bottom: 54px; rotate: -16deg; }
  .coin--2 { width: 74px; left: 470px; bottom: 96px; rotate: 10deg; opacity: 0.9; }
  .coin--3 { width: 190px; right: 300px; bottom: -40px; rotate: -8deg; filter: blur(5px); opacity: 0.8; }
  .body-text { position: relative; padding: 74px 0 0 84px; max-width: 760px; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 9px 18px; border-radius: 999px;
    border: 1px solid rgba(196,166,236,0.28); background: rgba(23,21,19,0.6);
    font-family: "IBM Plex Mono", monospace; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-secondary);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 10px var(--accent-2); }
  .brand { display: flex; align-items: center; gap: 16px; margin: 34px 0 22px; }
  .brand svg { width: 42px; height: 42px; }
  .brand span { font-family: "Fraunces", serif; font-weight: 500; font-size: 38px; letter-spacing: -0.02em; }
  h1 {
    font-family: "Fraunces", serif; font-weight: 400; font-size: 70px; line-height: 1.04; letter-spacing: -0.02em;
    background: linear-gradient(100deg, var(--text) 20%, var(--accent-ink) 62%, var(--accent-2) 96%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { margin-top: 26px; font-size: 22px; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="card">
  <div class="orb orb--a"></div>
  <div class="orb orb--b"></div>
  <div class="orb orb--c"></div>

  <div class="vinyl">
    <img src="../public/assets/art/vinyl.webp" alt="">
    <img src="../public/assets/art/vinyl-label.webp" alt="">
  </div>
  <img class="coin coin--1" src="../public/assets/art/coin-tilt.webp" alt="">
  <img class="coin coin--2" src="../public/assets/art/coin.webp" alt="">
  <img class="coin coin--3" src="../public/assets/art/coin-tilt.webp" alt="">

  <div class="body-text">
    <div class="pill"><span class="dot"></span>Live on Ethereum Sepolia · testnet</div>
    <div class="brand">
      <svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
        <line x1="16" y1="28" x2="16" y2="92" stroke="#C4A6EC" stroke-width="6.5" stroke-linecap="round"/>
        <line x1="27" y1="30.1" x2="27" y2="89.9" stroke="#C4A6EC" stroke-width="6.5" stroke-linecap="round" opacity="0.95"/>
        <line x1="38" y1="35.9" x2="38" y2="84.1" stroke="#C4A6EC" stroke-width="6.5" stroke-linecap="round" opacity="0.8"/>
        <line x1="49" y1="44.7" x2="49" y2="75.3" stroke="#C4A6EC" stroke-width="6.5" stroke-linecap="round" opacity="0.6"/>
        <line x1="60" y1="55" x2="60" y2="65" stroke="#C4A6EC" stroke-width="6.5" stroke-linecap="round" opacity="0.4"/>
        <line x1="71" y1="44.7" x2="71" y2="75.3" stroke="#C4A6EC" stroke-width="6.5" stroke-linecap="round" opacity="0.6"/>
        <line x1="82" y1="35.9" x2="82" y2="84.1" stroke="#C4A6EC" stroke-width="6.5" stroke-linecap="round" opacity="0.8"/>
        <line x1="93" y1="30.1" x2="93" y2="89.9" stroke="#C4A6EC" stroke-width="6.5" stroke-linecap="round" opacity="0.95"/>
        <line x1="104" y1="28" x2="104" y2="92" stroke="#C4A6EC" stroke-width="6.5" stroke-linecap="round"/>
      </svg>
      <span>Humfiverse</span>
    </div>
    <h1>Music royalties,<br>tokenized on-chain.</h1>
    <p class="sub">ERC-1155 catalogue shares · milestone escrow for new tracks</p>
  </div>

  <div class="grain"></div>
</div>
</body>
</html>
