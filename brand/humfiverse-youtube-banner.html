<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08090C;width:2560px;height:1440px;overflow:hidden}
.c{position:relative;width:2560px;height:1440px;background:#08090C;font-family:Geist,sans-serif;color:#EDEFF3;overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(1200px 520px at 55% 46%,rgba(113,89,255,.22),transparent 70%),radial-gradient(900px 420px at 88% 70%,rgba(45,212,160,.10),transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:80px 80px;background-position:0 40px;-webkit-mask-image:radial-gradient(1500px 620px at 50% 50%,#000 30%,transparent 80%)}
svg.bg{position:absolute;inset:0}
.stv path{stroke:url(#sg);stroke-width:1.6;opacity:.55;fill:none}
.wave{stroke:url(#wg);stroke-width:3;fill:none}
.txt{position:absolute;left:0;right:0;top:588px;display:flex;flex-direction:column;align-items:center}
.brand{display:flex;align-items:center;gap:30px}
.brand svg{width:112px;height:112px}
.brand span{font-weight:600;font-size:110px;letter-spacing:-0.035em}
.tag{margin-top:26px;font-size:46px;font-weight:500;letter-spacing:-0.01em;background:linear-gradient(95deg,#EDEFF3 10%,#A797FF 60%,#2DD4A0 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.meta{margin-top:26px;font-family:"Geist Mono",monospace;font-size:23px;letter-spacing:.12em;text-transform:uppercase;color:#9AA2B0;display:flex;gap:18px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;background:#2DD4A0;box-shadow:0 0 14px #2DD4A0}
</style></head><body><div class="c">
<div class="glow"></div><div class="grid"></div>
<svg class="bg" id="bg" viewBox="0 0 2560 1440" width="2560" height="1440">
<defs>
<linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#A797FF" stop-opacity="0"/><stop offset=".25" stop-color="#A797FF"/><stop offset=".8" stop-color="#2DD4A0"/><stop offset="1" stop-color="#2DD4A0" stop-opacity="0"/></linearGradient>
<linearGradient id="wg" x1="0" x2="1"><stop offset="0" stop-color="#A797FF" stop-opacity="0"/><stop offset=".25" stop-color="#A797FF"/><stop offset=".85" stop-color="#2DD4A0"/><stop offset="1" stop-color="#2DD4A0" stop-opacity="0"/></linearGradient>
</defs>
<g class="stv" id="stv"></g><path class="wave" id="wave"/>
</svg>
<div class="txt">
<div class="brand"><svg viewBox="0 0 120 120"><defs><linearGradient id="mk" gradientUnits="userSpaceOnUse" x1="16" y1="0" x2="104" y2="0"><stop offset="0" stop-color="#A797FF"/><stop offset="1" stop-color="#2DD4A0"/></linearGradient></defs><line x1="16" y1="28" x2="16" y2="92" stroke="url(#mk)" stroke-width="6.5" stroke-linecap="round" opacity="1"/><line x1="27" y1="30.1" x2="27" y2="89.9" stroke="url(#mk)" stroke-width="6.5" stroke-linecap="round" opacity="0.95"/><line x1="38" y1="35.9" x2="38" y2="84.1" stroke="url(#mk)" stroke-width="6.5" stroke-linecap="round" opacity="0.8"/><line x1="49" y1="44.7" x2="49" y2="75.3" stroke="url(#mk)" stroke-width="6.5" stroke-linecap="round" opacity="0.6"/><line x1="60" y1="55" x2="60" y2="65" stroke="url(#mk)" stroke-width="6.5" stroke-linecap="round" opacity="0.4"/><line x1="71" y1="44.7" x2="71" y2="75.3" stroke="url(#mk)" stroke-width="6.5" stroke-linecap="round" opacity="0.6"/><line x1="82" y1="35.9" x2="82" y2="84.1" stroke="url(#mk)" stroke-width="6.5" stroke-linecap="round" opacity="0.8"/><line x1="93" y1="30.1" x2="93" y2="89.9" stroke="url(#mk)" stroke-width="6.5" stroke-linecap="round" opacity="0.95"/><line x1="104" y1="28" x2="104" y2="92" stroke="url(#mk)" stroke-width="6.5" stroke-linecap="round" opacity="1"/></svg><span>Humfiverse</span></div>
<div class="tag">Fan funding for independent music, on-chain.</div>
<div class="meta"><span class="dot"></span>Live on Ethereum Sepolia · testnet</div>
</div></div>
<script>
// two five-line staves as ribbons, as in the site background and the X header
const g=document.getElementById('stv');
function staff(y0,amp,ph,freq,gap){for(let k=0;k<5;k++){let d='';for(let x=-40;x<=2600;x+=10){const t=x/2560;
const y=y0+k*gap*(1+0.35*Math.sin(t*3.1+ph))+amp*Math.sin(t*Math.PI*freq+ph)+amp*0.35*Math.sin(t*Math.PI*freq*2.3+ph*1.7);
d+=(d?' L':'M')+x+' '+y.toFixed(1)}const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);g.appendChild(p)}}
staff(470,55,0.6,1.6,12); staff(896,28,2.4,1.9,9);
staff(300,90,1.2,1.3,16); staff(1120,80,3.3,1.4,15);
// waveform line near the bottom of the desktop-visible band
let s=1234567;const r=()=>(s=(s*16807)%2147483647)/2147483647;
let d='',v=0;for(let x=-20;x<=2580;x+=8){v=v*0.86+(r()-0.5)*9;const y=1010-x*0.03+v+10*Math.sin(x/90);d+=(d?' L':'M')+x+' '+y.toFixed(1)}
document.getElementById('wave').setAttribute('d',d);
</script></body></html>
