<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Humfiverse</title>
<meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>Humfiverse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ============================= TOKENS ============================= */
  :root{
    color-scheme: light;
    --bg: #F7F4EE;
    --surface: #FFFFFF;
    --surface-2: #F1ECE1;
    --surface-raised: #FFFFFF;
    --border: #E4DFD3;
    --border-strong: #D3CBB8;
    --text: #1E1B16;
    --text-secondary: #6B6459;
    --text-muted: #948C7D;
    --accent: #A6572A;
    --accent-ink: #B5652C;
    --accent-on: #FFFFFF;
    --accent-soft: #F3E4D3;
    --accent-soft-border: #E7CBA8;
    --good: #0ca30c;
    --good-soft: #E4F5DE;
    --warning: #b3790a;
    --warning-soft: #FBEDD0;
    --serious: #ec835a;
    --critical: #d03b3b;
    --critical-soft: #FBE2DE;
    --chart-line: #2a78d6;
    --chart-fill: rgba(42,120,214,0.14);
    --shadow-sm: 0 1px 2px rgba(30,27,22,0.06);
    --shadow-md: 0 6px 20px -6px rgba(30,27,22,0.16);
    --shadow-lg: 0 20px 48px -12px rgba(30,27,22,0.28);
    --focus-ring: #2a78d6;
    --scrim: rgba(20,17,13,0.5);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #131110;
      --surface: #1C1917;
      --surface-2: #232019;
      --surface-raised: #241F1B;
      --border: #322D27;
      --border-strong: #433C33;
      --text: #F2EEE6;
      --text-secondary: #A69C8D;
      --text-muted: #7A7266;
      --accent: #D98A4D;
      --accent-ink: #E3A06B;
      --accent-on: #131110;
      --accent-soft: #3A2A1C;
      --accent-soft-border: #58412A;
      --good: #3FCB3F;
      --good-soft: #1C2F1A;
      --warning: #E8B23C;
      --warning-soft: #33280F;
      --serious: #f0996f;
      --critical: #e66767;
      --critical-soft: #3A1E1B;
      --chart-line: #3987e5;
      --chart-fill: rgba(57,135,229,0.18);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 6px 20px -6px rgba(0,0,0,0.45);
      --shadow-lg: 0 24px 56px -14px rgba(0,0,0,0.6);
      --focus-ring: #3987e5;
      --scrim: rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #131110;
    --surface: #1C1917;
    --surface-2: #232019;
    --surface-raised: #241F1B;
    --border: #322D27;
    --border-strong: #433C33;
    --text: #F2EEE6;
    --text-secondary: #A69C8D;
    --text-muted: #7A7266;
    --accent: #D98A4D;
    --accent-ink: #E3A06B;
    --accent-on: #131110;
    --accent-soft: #3A2A1C;
    --accent-soft-border: #58412A;
    --good: #3FCB3F;
    --good-soft: #1C2F1A;
    --warning: #E8B23C;
    --warning-soft: #33280F;
    --serious: #f0996f;
    --critical: #e66767;
    --critical-soft: #3A1E1B;
    --chart-line: #3987e5;
    --chart-fill: rgba(57,135,229,0.18);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 6px 20px -6px rgba(0,0,0,0.45);
    --shadow-lg: 0 24px 56px -14px rgba(0,0,0,0.6);
    --focus-ring: #3987e5;
    --scrim: rgba(0,0,0,0.6);
  }

  /* ============================= BASE ============================= */
  *,*::before,*::after{ box-sizing: border-box; }
  html{ -webkit-text-size-adjust: 100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4{
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 600;
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  p{ margin:0; }
  a{ color: var(--accent-ink); }
  button{ font-family: inherit; }
  ::selection{ background: var(--accent-soft); }
  .mono{ font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
  :focus-visible{ outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  img,svg{ display:block; max-width:100%; }

  /* ============================= LAYOUT SHELL ============================= */
  #app{ min-height: 100vh; display:flex; flex-direction:column; }

  .topbar{
    position: sticky; top:0; z-index: 40;
    display:flex; align-items:center; gap:12px 20px; flex-wrap: wrap;
    padding: 14px clamp(16px,4vw,40px);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); flex:0 0 auto; }
  .brand-mark{ width:30px; height:30px; flex:none; }
  .brand-name{ font-family:"Fraunces",serif; font-weight:600; font-size:19px; letter-spacing:-0.01em; }
  .brand-tag{ display:none; }

  .topnav{ display:flex; align-items:center; gap:4px; flex:0 1 auto; min-width:0; flex-wrap:wrap; }
  .topnav a{
    text-decoration:none; color:var(--text-secondary); font-size:14px; font-weight:500;
    padding:8px 12px; border-radius:8px; white-space:nowrap;
  }
  .topnav a:hover{ background: var(--surface-2); color:var(--text); }
  .topnav a.active{ background: var(--surface-2); color:var(--text); }

  .side-spacer{ flex:1; }

  .role-switch{
    display:flex; align-items:center; background: var(--surface-2); border:1px solid var(--border);
    border-radius: 999px; padding:3px; gap:2px; flex:0 0 auto;
  }
  .role-switch button{
    border:none; background:transparent; padding:6px 14px; border-radius:999px; font-size:13px; font-weight:600;
    color: var(--text-secondary); cursor:pointer; transition: background .15s ease, color .15s ease;
  }
  .role-switch button.active{ background: var(--surface); color:var(--text); box-shadow: var(--shadow-sm); }

  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; flex:none;
    border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text-secondary);
    cursor:pointer;
  }
  .icon-btn:hover{ color:var(--text); border-color:var(--border-strong); }

  main{ flex:1; }
  .container{ max-width: 1180px; margin:0 auto; padding: 32px clamp(16px,4vw,40px) 80px; }
  .container.narrow{ max-width: 760px; }
  .container.wide{ max-width: 1320px; }

  .page-head{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:28px; }
  .page-head h1{ font-size: clamp(26px,3.4vw,34px); }
  .page-kicker{ font-size:12px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color: var(--accent-ink); margin-bottom:8px; display:block; }
  .page-sub{ color: var(--text-secondary); font-size:14.5px; max-width:60ch; margin-top:8px; }

  .footer{
    border-top:1px solid var(--border); padding: 22px clamp(16px,4vw,40px);
    display:flex; flex-wrap:wrap; gap:10px 24px; justify-content:space-between; align-items:center;
    color: var(--text-muted); font-size:12.5px;
  }

  /* ============================= BANNER ============================= */
  .pilot-banner{
    display:flex; gap:12px; align-items:flex-start; padding:12px 16px; margin: 0 0 24px;
    background: var(--accent-soft); border:1px solid var(--accent-soft-border); border-radius:12px;
    font-size:13px; color: var(--text); line-height:1.5;
  }
  .pilot-banner svg{ flex:none; margin-top:2px; color: var(--accent-ink); }
  .pilot-banner b{ font-weight:600; }
  .pilot-banner .dismiss{ margin-left:auto; background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:2px; flex:none; }

  /* ============================= BUTTONS ============================= */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-size:14px; font-weight:600; padding:10px 18px; border-radius:10px; border:1px solid transparent;
    cursor:pointer; text-decoration:none; line-height:1.2; transition: transform .08s ease, background .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{ background: var(--accent); color: var(--accent-on); }
  .btn-primary:hover{ background: color-mix(in srgb, var(--accent) 88%, black 6%); }
  .btn-secondary{ background: var(--surface); color: var(--text); border-color: var(--border-strong); }
  .btn-secondary:hover{ border-color: var(--accent-ink); color: var(--accent-ink); }
  .btn-ghost{ background: transparent; color: var(--text-secondary); }
  .btn-ghost:hover{ background: var(--surface-2); color: var(--text); }
  .btn-block{ width:100%; }
  .btn-lg{ padding:12px 22px; font-size:15px; }
  .btn-sm{ padding:6px 12px; font-size:12.5px; border-radius:8px; }
  .btn[disabled]{ opacity:0.5; cursor:not-allowed; }
  .btn svg{ width:16px; height:16px; flex:none; }

  /* ============================= CARDS / CHIPS ============================= */
  .card{ background: var(--surface); border:1px solid var(--border); border-radius:16px; }
  .panel{ background: var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; }

  .chip{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600;
    padding:4px 9px; border-radius:999px; letter-spacing:0.01em; white-space:nowrap; line-height:1.3;
  }
  .chip svg{ width:12px; height:12px; }
  .chip-good{ background: var(--good-soft); color: var(--good); }
  .chip-warning{ background: var(--warning-soft); color: var(--warning); }
  .chip-critical{ background: var(--critical-soft); color: var(--critical); }
  .chip-neutral{ background: var(--surface-2); color: var(--text-secondary); border:1px solid var(--border); }
  .chip-accent{ background: var(--accent-soft); color: var(--accent-ink); }

  /* ============================= MARKETPLACE GRID ============================= */
  .toolbar{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:22px; align-items:center; }
  .segmented{ display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px; }
  .segmented button{ border:none; background:transparent; padding:7px 13px; border-radius:8px; font-size:13px; font-weight:600; color:var(--text-secondary); cursor:pointer; }
  .segmented button.active{ background:var(--surface); color:var(--text); box-shadow: var(--shadow-sm); }
  .search-box{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px 12px; flex:1; min-width:180px; max-width:320px; }
  .search-box svg{ flex:none; color:var(--text-muted); }
  .search-box input{ border:none; outline:none; background:transparent; color:var(--text); font-size:13.5px; width:100%; }

  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap:18px; }

  .asset-card{
    display:flex; flex-direction:column; overflow:hidden; text-decoration:none; color:inherit;
    transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .asset-card:hover{ border-color: var(--border-strong); box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .asset-cover{ aspect-ratio: 16/10; position:relative; overflow:hidden; }

  .cover-art{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; overflow:hidden; container-type: inline-size; }
  .cover-monogram{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:"Fraunces",serif; font-weight:600; color:rgba(255,255,255,0.16);
    font-size:42cqw; line-height:1; user-select:none; letter-spacing:-0.02em;
  }
  .cover-motif{ position:absolute; right:-8%; bottom:-12%; color:rgba(255,255,255,0.20); transform:rotate(-8deg); pointer-events:none; }
  .cover-motif svg{ width:100%; height:100%; }
  .cover-play{
    position:relative; z-index:2; border-radius:50%; flex:none;
    background:rgba(18,15,12,0.42); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; color:#fff;
    box-shadow:0 6px 18px rgba(0,0,0,0.35), inset 0 0 0 1.5px rgba(255,255,255,0.35);
    transition:transform .18s ease, background .18s ease;
  }
  .cover-play svg{ width:40%; height:40%; margin-left:8%; }
  .asset-card:hover .cover-play{ transform:scale(1.1); background:rgba(18,15,12,0.58); }
  .asset-cover .chip{ position:absolute; top:10px; left:10px; backdrop-filter: blur(6px); }
  .asset-cover .chip.right{ left:auto; right:10px; }
  .asset-body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .asset-title{ font-family:"Fraunces",serif; font-size:17px; font-weight:600; }
  .asset-artist{ color: var(--text-secondary); font-size:13px; margin-top:2px; }
  .asset-meta-row{ display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; color:var(--text-secondary); }
  .asset-meta-row .value{ font-family:"IBM Plex Mono",monospace; color:var(--text); font-weight:600; }

  .meter{ height:6px; background: var(--surface-2); border-radius:999px; overflow:hidden; }
  .meter > span{ display:block; height:100%; background: var(--accent); border-radius:999px; }

  .asset-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:4px; }
  .asset-foot .yield{ font-family:"IBM Plex Mono",monospace; font-weight:600; color: var(--good); font-size:13.5px; }
  .asset-foot .yield.venture{ color: var(--accent-ink); }

  /* ============================= DETAIL PAGE ============================= */
  .breadcrumb{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); margin-bottom:18px; }
  .breadcrumb a{ color:var(--text-secondary); text-decoration:none; }
  .breadcrumb a:hover{ color:var(--accent-ink); }

  .detail-layout{ display:grid; grid-template-columns: minmax(0,1fr) 340px; gap:32px; align-items:start; }
  @media (max-width: 880px){ .detail-layout{ grid-template-columns: minmax(0,1fr); } }

  .detail-hero{ display:flex; gap:20px; margin-bottom:24px; }
  .detail-cover{ width:120px; height:120px; border-radius:16px; flex:none; overflow:hidden; box-shadow: var(--shadow-md); position:relative; }
  .detail-heading .chips{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .detail-heading h1{ font-size: clamp(24px,3vw,32px); }
  .detail-heading .artist{ color:var(--text-secondary); font-size:15px; margin-top:4px; }

  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:22px; overflow-x:auto; }
  .tabs button{
    border:none; background:none; padding:10px 4px; margin-right:22px; font-size:14px; font-weight:600;
    color:var(--text-secondary); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;
  }
  .tabs button.active{ color:var(--text); border-color: var(--accent); }

  .tab-panel{ display:flex; flex-direction:column; gap:22px; }
  .prose{ font-size:14.5px; color:var(--text-secondary); line-height:1.7; max-width:64ch; }
  .prose strong{ color:var(--text); }

  .stat-row{ display:grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap:14px; }
  .stat-tile{ padding:14px 16px; }
  .stat-tile .label{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted); font-weight:600; }
  .stat-tile .value{ font-family:"IBM Plex Mono",monospace; font-size:20px; font-weight:600; margin-top:6px; }
  .stat-tile .delta{ font-size:12px; margin-top:4px; color:var(--good); }

  .chart-card{ padding:18px 20px 12px; }
  .chart-card-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .chart-card-head h3{ font-size:15px; font-family:"IBM Plex Sans",sans-serif; font-weight:600; }
  .chart-card-head .legend{ font-size:12px; color:var(--text-secondary); display:flex; align-items:center; gap:6px; }
  .legend-dot{ width:8px; height:8px; border-radius:50%; background: var(--chart-line); display:inline-block; }

  .risk-list{ display:flex; flex-direction:column; gap:10px; }
  .risk-item{ display:flex; gap:10px; padding:12px 14px; border-radius:12px; background: var(--surface-2); border:1px solid var(--border); font-size:13.5px; }
  .risk-item svg{ flex:none; color: var(--warning); margin-top:1px; }

  .disclosure-grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .disclosure-item{ padding:12px 14px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); }
  .disclosure-item .k{ font-size:12px; color:var(--text-secondary); margin-bottom:6px; }
  .disclosure-item .v{ font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:6px; }

  .doc-list{ display:flex; flex-direction:column; gap:8px; }
  .doc-row{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; border:1px solid var(--border); font-size:13.5px; }
  .doc-row svg{ color:var(--text-muted); flex:none; }
  .doc-row .name{ flex:1; }
  .doc-row .meta{ color:var(--text-muted); font-size:12px; }

  /* Buy panel */
  .buy-panel{ position:sticky; top:88px; padding:20px; display:flex; flex-direction:column; gap:16px; }
  .buy-price{ display:flex; align-items:baseline; justify-content:space-between; }
  .buy-price .amount{ font-family:"IBM Plex Mono",monospace; font-size:26px; font-weight:600; }
  .buy-price .unit{ color:var(--text-secondary); font-size:13px; }
  .qty-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .stepper{ display:flex; align-items:center; border:1px solid var(--border-strong); border-radius:10px; overflow:hidden; }
  .stepper button{ width:34px; height:34px; border:none; background:var(--surface-2); color:var(--text); font-size:16px; cursor:pointer; }
  .stepper button:hover{ background: var(--accent-soft); color: var(--accent-ink); }
  .stepper input{ width:52px; text-align:center; border:none; background:var(--surface); color:var(--text); font-family:"IBM Plex Mono",monospace; font-size:14px; }
  .buy-summary{ display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--text-secondary); padding-top:10px; border-top:1px dashed var(--border); }
  .buy-summary .row{ display:flex; justify-content:space-between; }
  .buy-summary .total{ color:var(--text); font-weight:600; font-size:14px; padding-top:6px; border-top:1px solid var(--border); }
  .check-row{ display:flex; gap:8px; align-items:flex-start; font-size:12px; color:var(--text-secondary); line-height:1.5; }
  .check-row input{ margin-top:3px; flex:none; }

  /* ============================= FORMS ============================= */
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:13px; font-weight:600; color:var(--text); }
  .field .hint{ font-size:12px; color:var(--text-muted); }
  .field input[type="text"], .field input[type="number"], .field textarea, .field select{
    background: var(--surface); border:1px solid var(--border-strong); border-radius:10px; padding:10px 12px;
    font-size:14px; color:var(--text); font-family:inherit; width:100%;
  }
  .field textarea{ resize:vertical; min-height:84px; }
  .field input:focus, .field textarea:focus, .field select:focus{ border-color: var(--focus-ring); }
  .form-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width:600px){ .form-grid{ grid-template-columns: minmax(0,1fr); } }

  .choice-cards{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  @media (max-width:700px){ .choice-cards{ grid-template-columns:minmax(0,1fr); } }
  .choice-card{ text-align:left; padding:18px; border:1.5px solid var(--border); border-radius:14px; background:var(--surface); cursor:pointer; display:flex; flex-direction:column; gap:8px; }
  .choice-card:hover{ border-color: var(--border-strong); }
  .choice-card.selected{ border-color: var(--accent); background: var(--accent-soft); }
  .choice-card .icon{ width:36px; height:36px; border-radius:10px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--accent-ink); }

/* ===================================================================
   COVER ART — procedural gradient covers per asset (no external images)
=================================================================== */
function coverStyle(seed, kind){
  // deterministic hue pair from seed string
  let h = 0; for (let i=0;i<seed.length;i++){ h = (h*31 + seed.charCodeAt(i)) % 360; }
  const h1 = h;
  const h2 = (h + (kind === 'preproduction' ? 46 : 28)) % 360;
  const s1 = kind === 'preproduction' ? 62 : 48;
  const l1 = kind === 'preproduction' ? 42 : 38;
  return `background:
    radial-gradient(120% 140% at 15% 15%, hsl(${h1} ${s1}% ${l1+10}%) 0%, transparent 60%),
    radial-gradient(140% 160% at 90% 95%, hsl(${h2} ${s1-8}% ${l1}%) 0%, transparent 65%),
    linear-gradient(135deg, hsl(${h1} ${s1-10}% ${l1-6}%), hsl(${h2} ${s1-6}% ${l1-14}%));`;
}
function coverSvgTexture(){
  return '<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;opacity:.5;mix-blend-mode:overlay;"><circle cx="78" cy="24" r="34" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="10"/><circle cx="78" cy="24" r="20" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"/></svg>';
}

/* Full "album art" treatment: gradient tied to the track id + a large initial
   + a genre-motif watermark + an optional play affordance — signals "this is
   a song" and keeps each cover visually distinct per title/artist, without
   depending on any external image. */
function renderCover(asset, opts){
  opts = opts || {};
  const showPlay = opts.play !== false;
  const playSize = opts.playSize || 52;
  const motifSize = opts.motifSize || 90;
  const monogram = (asset.title || '?').trim().charAt(0).toUpperCase();
  const motif = genreMotif(asset.genre);
  return `
    <div class="cover-art" style="${coverStyle(asset.id, asset.kind)}">
      ${coverSvgTexture()}
      <span class="cover-monogram" aria-hidden="true">${monogram}</span>
      <span class="cover-motif" aria-hidden="true" style="width:${motifSize}px; height:${motifSize}px;">${icon(motif)}</span>
      ${showPlay ? `<span class="cover-play" style="width:${playSize}px; height:${playSize}px;" role="img" aria-label="${asset.title} — track preview">${icon('play')}</span>` : ''}
    </div>`;
}

function monthLabel(offsetFromNow){
  const d = new Date(2026,7,1); // Aug 2026 anchor
  d.setMonth(d.getMonth() - offsetFromNow);
  return d.toLocaleString('en', { month:'short', year:'2-digit' });
}
function buildRoyaltyHistory(months, base, growth, volatility, seed){
  const out = [];
  let rnd = seed;
  const next = () => { rnd = (rnd*9301+49297) % 233280; return rnd/233280; };
  for (let i = months-1; i>=0; i--){
    const trend = base * Math.pow(growth, months-1-i);
    const noise = 1 + (next()-0.5) * volatility;
    out.push({ month: monthLabel(i), royaltyUSD: Math.max(0, Math.round(trend*noise)) });
  }
  return out;
}

/* ===================================================================
   BACKEND — fetches live data from the mock API server (server/server.js)
   when reachable, falling back to the bundled mock data above otherwise
   (e.g. when this page is opened as a plain static file, or the backend
   isn't running). Configure the API origin via window.HUMFIVERSE_API_BASE,
   set below — defaults to localhost for local dev.
=================================================================== */
const API_BASE = window.HUMFIVERSE_API_BASE || 'http://localhost:3001';
let backendAvailable = false;

async function hydrateFromBackend(){
  try {
    const res = await fetch(API_BASE + '/api/data');
    if (!res.ok) throw new Error('bad response: ' + res.status);
    const data = await res.json();
    if (Array.isArray(data.assets) && data.assets.length){ ASSETS.length = 0; ASSETS.push(...data.assets); }
    if (Array.isArray(data.campaigns) && data.campaigns.length){ CAMPAIGNS.length = 0; CAMPAIGNS.push(...data.campaigns); }
    if (data.portfolio) store.state.portfolio = data.portfolio;
    backendAvailable = true;
  } catch (err){
    console.warn('Humfiverse backend unavailable — using bundled mock data.', err);
    backendAvailable = false;
  }
}

async function redeemViaBackend(assetId){
  const res = await fetch(API_BASE + '/api/redeem', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ assetId })
  });
  if (!res.ok) throw new Error('redeem failed: ' + res.status);
  return res.json();
}

function assetById(id){ return ASSETS.find(a => a.id === id); }
function fundingRaised(a){ return a.tokenPrice * a.tokensSold; }
function fundingGoal(a){ return a.tokenPrice * a.tokensTotal; }
function fundingPct(a){ return Math.min(100, Math.round((a.tokensSold/a.tokensTotal)*100)); }

const CAMPAIGNS = [
  {
    id:'glass-horizon', assetId:'glass-horizon', title:'Glass Horizon (Draft)', artistName:'Cerchio Blu',
    holders:184, milestones: ASSETS.find(a=>a.id==='glass-horizon').milestones,
  }
];

function detectInitialLocale(){
  try {
    const saved = localStorage.getItem('humfiverse-locale');
    if (saved && SUPPORTED_LOCALES.includes(saved)) return saved;
  } catch (err){ /* localStorage unavailable */ }
  const nav = (navigator.language || 'en').slice(0,2).toLowerCase();
  return SUPPORTED_LOCALES.includes(nav) ? nav : 'en';
}
function setLocale(locale){
  if (!SUPPORTED_LOCALES.includes(locale)) return;
  store.set({ locale });
  try { localStorage.setItem('humfiverse-locale', locale); } catch (err){ /* ignore */ }
  document.documentElement.lang = locale;
}
function t(key, vars){
  const dict = I18N[store.state.locale] || I18N.en;
  let str = dict[key] !== undefined ? dict[key] : (I18N.en[key] !== undefined ? I18N.en[key] : key);
  if (vars){
    Object.keys(vars).forEach(k => { str = str.split('{'+k+'}').join(vars[k]); });
  }
  return str;
}

function parseRoute(){
  const hash = location.hash.slice(1) || '/marketplace';
  const [path, query] = hash.split('?');
  const parts = path.split('/').filter(Boolean);
  return { path, parts, query: new URLSearchParams(query||'') };
}
window.addEventListener('hashchange', () => {
  store.set({ route: parseRoute() });
  window.scrollTo(0,0);
});

function showToast(message, opts){
  opts = opts || {};
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${icon(opts.icon || 'checkCircle')}<span>${message}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.transition='opacity .3s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3200);
}

function fmtUSD(n){ return '$' + n.toLocaleString('en-US', { minimumFractionDigits: n % 1 !== 0 ? 2 : 0, maximumFractionDigits: 2 }); }
function fmtUSDShort(n){
  if (n >= 1000) return '$' + (n/1000).toFixed(n>=10000?0:1) + 'k';
  return '$' + Math.round(n);
}

/* ===================================================================
   WALLET — MetaMask / injected-provider connection
   Only identity calls (eth_accounts, eth_requestAccounts, eth_chainId)
   are used. No signature or transaction is ever requested from the
   real wallet — redeeming is simulated client-side (see renderRedeem).
=================================================================== */
const CHAIN_NAMES = {
  '0x1':'Ethereum Mainnet', '0x89':'Polygon', '0xa':'Optimism', '0xa4b1':'Arbitrum One',
  '0x2105':'Base', '0xaa36a7':'Sepolia Testnet', '0x5':'Goerli Testnet', '0x38':'BNB Chain',
};
function chainName(hex){
  if (!hex) return 'Unknown network';
  return CHAIN_NAMES[hex.toLowerCase()] || ('Chain ' + parseInt(hex,16));
}
function truncateAddr(addr){ return addr ? addr.slice(0,6) + '…' + addr.slice(-4) : ''; }
function fakeTxHash(){
  const chars = '0123456789abcdef'; let h = '0x';
  for (let i=0;i<64;i++) h += chars[Math.floor(Math.random()*16)];
  return h;
}
async function connectWallet(){
  if (!window.ethereum){
    showToast(t('toast.noWalletDetected'), { icon:'alert' });
    return;
  }
  store.update(s => { s.wallet.connecting = true; });
  try {
    const accounts = await window.ethereum.request({ method:'eth_requestAccounts' });
    const chainId = await window.ethereum.request({ method:'eth_chainId' });
    store.update(s => { s.wallet.address = accounts[0] || null; s.wallet.chainId = chainId; s.wallet.connecting = false; });
    if (accounts && accounts[0]) showToast(t('toast.walletConnected'), { icon:'wallet' });
  } catch (err){
    store.update(s => { s.wallet.connecting = false; });
    showToast(err && err.code === 4001 ? t('toast.connectionRejected') : t('toast.couldNotConnect'), { icon:'alert' });
  }
}
function disconnectWallet(){
  store.update(s => { s.wallet.address = null; s.wallet.chainId = null; });
  showToast(t('toast.walletDisconnected'), { icon:'info' });
}
async function silentWalletSync(){
  if (!window.ethereum) return;
  try {
    const accounts = await window.ethereum.request({ method:'eth_accounts' }); // no popup
    if (accounts && accounts[0]){
      const chainId = await window.ethereum.request({ method:'eth_chainId' });
      store.update(s => { s.wallet.address = accounts[0]; s.wallet.chainId = chainId; });
    }
  } catch (err){ /* ignore — silent check */ }
}
function wireWalletProviderEvents(){
  if (!window.ethereum || !window.ethereum.on) return;
  window.ethereum.on('accountsChanged', (accounts) => {
    store.update(s => { s.wallet.address = (accounts && accounts[0]) || null; });
  });
  window.ethereum.on('chainChanged', (chainId) => {
    store.update(s => { s.wallet.chainId = chainId; });
  });
}

/* ===================================================================
   CHART — single-series royalty income line+area, with hover
   (sequential blue #2a78d6 / #3987e5, validated against light/dark surfaces)
=================================================================== */
let chartSeq = 0;
function renderLineChart(data, opts){
  opts = opts || {};
  const id = 'chart-' + (++chartSeq);
  const w = 640, h = 200, padL = 6, padR = 6, padT = 14, padB = 26;
  const vals = data.map(d => d.royaltyUSD);
  const max = Math.max(...vals) * 1.15;
  const min = 0;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const x = i => padL + (i/(data.length-1)) * innerW;
  const y = v => padT + innerH - ((v-min)/(max-min)) * innerH;
  const points = data.map((d,i) => [x(i), y(d.royaltyUSD)]);
  const linePath = points.map((p,i) => (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${x(data.length-1).toFixed(1)},${(padT+innerH).toFixed(1)} L${padL},${(padT+innerH).toFixed(1)} Z`;
  const gridLines = [0,0.25,0.5,0.75,1].map(t => padT + innerH*t);
  const labelEvery = Math.ceil(data.length/6);
  const labels = data.map((d,i)=>({i,d})).filter(o => o.i % labelEvery === 0 || o.i===data.length-1);

  const dots = points.map((p,i) => `<circle class="lc-dot" data-i="${i}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="9" fill="transparent"></circle>`).join('');

  return `
  <div class="chart-svg-wrap" style="position:relative;">
    <svg id="${id}" viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;overflow:visible;" preserveAspectRatio="none">
      <defs>
        <linearGradient id="${id}-fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--chart-line)" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="var(--chart-line)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${gridLines.map(gy => `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${w-padR}" y2="${gy.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`).join('')}
      <path d="${areaPath}" fill="url(#${id}-fill)" stroke="none"/>
      <path d="${linePath}" fill="none" stroke="var(--chart-line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="lc-endpoint" cx="${points[points.length-1][0].toFixed(1)}" cy="${points[points.length-1][1].toFixed(1)}" r="4" fill="var(--chart-line)"/>
      <line class="lc-crosshair" x1="0" y1="${padT}" x2="0" y2="${padT+innerH}" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
      <circle class="lc-hoverdot" r="4.5" fill="var(--chart-line)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
      ${dots}
      ${labels.map(o => `<text x="${x(o.i).toFixed(1)}" y="${h-6}" font-size="9" fill="var(--text-muted)" text-anchor="${o.i===0?'start':o.i===data.length-1?'end':'middle'}" font-family="IBM Plex Mono, monospace">${o.d.month}</text>`).join('')}
    </svg>
    <div class="lc-tooltip mono" data-for="${id}" style="position:absolute; pointer-events:none; opacity:0; transition:opacity .1s ease; background:var(--text); color:var(--bg); font-size:11.5px; padding:5px 9px; border-radius:8px; white-space:nowrap; transform:translate(-50%,-130%); z-index:5;"></div>
  </div>`;
}
function mountLineChart(root, data){
  root.querySelectorAll('.chart-svg-wrap').forEach(wrap => {
    const svg = wrap.querySelector('svg');
    const tooltip = wrap.querySelector('.lc-tooltip');
    const crosshair = svg.querySelector('.lc-crosshair');
    const hoverdot = svg.querySelector('.lc-hoverdot');
    const dots = [...svg.querySelectorAll('.lc-dot')];
    function activate(i){
      const dot = dots[i]; if(!dot) return;
      const cx = parseFloat(dot.getAttribute('cx')), cy = parseFloat(dot.getAttribute('cy'));
      crosshair.setAttribute('x1', cx); crosshair.setAttribute('x2', cx); crosshair.setAttribute('opacity','1');
      hoverdot.setAttribute('cx', cx); hoverdot.setAttribute('cy', cy); hoverdot.setAttribute('opacity','1');
      const d = data[i];
      tooltip.style.opacity = '1';
      tooltip.style.left = (cx/640*100) + '%';
      tooltip.style.top = (cy/200*100) + '%';
      tooltip.innerHTML = `<strong>${fmtUSD(d.royaltyUSD)}</strong> · ${d.month}`;
    }
    function deactivate(){ crosshair.setAttribute('opacity','0'); hoverdot.setAttribute('opacity','0'); tooltip.style.opacity='0'; }
    dots.forEach(dot => {
      dot.addEventListener('mouseenter', () => activate(+dot.dataset.i));
      dot.addEventListener('focus', () => activate(+dot.dataset.i));
    });
    svg.addEventListener('mouseleave', deactivate);
  });
}

/* Small inline sparkline used on marketplace cards (no interactivity, decorative-but-accurate) */
function renderSparkline(data){
  const w=100,h=32; const vals=data.map(d=>d.royaltyUSD); const max=Math.max(...vals)*1.1||1;
  const pts = vals.map((v,i)=>[ (i/(vals.length-1))*w, h-(v/max)*h ]);
  const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100" height="32" preserveAspectRatio="none" style="overflow:visible;"><path d="${path}" fill="none" stroke="var(--chart-line)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* ===================================================================
   ROUTER DISPATCH
=================================================================== */
function renderRoute(){
  const s = store.state;
  const p = s.route.parts;
  if (p[0] === 'asset' && p[1]) return renderAssetDetail(p[1]);
  if (p[0] === 'portfolio') return renderPortfolio();
  if (p[0] === 'for-artists') return renderForArtists();
  if (p[0] === 'artist' && p[1] === 'onboarding') return renderOnboarding();
  if (p[0] === 'artist' && p[1] === 'dashboard') return renderArtistDashboard();
  if (p[0] === 'redeem') return renderRedeem();
  return renderMarketplace();
}

function render(){
  const app = document.getElementById('app');
  postRenderHooks = [];
  app.innerHTML = `
    ${renderTopbar()}
    <main><div class="container wide">${renderPilotBanner()}${renderRoute()}</div></main>
    ${renderFooter()}
  `;
  wireGlobalEvents(app);
  postRenderHooks.forEach(fn => fn());
}

function wireGlobalEvents(app){
  app.querySelectorAll('[data-lang]').forEach(btn => {
    btn.addEventListener('click', () => setLocale(btn.dataset.lang));
  });
  app.querySelectorAll('.role-switch [data-role]').forEach(btn => {
    btn.addEventListener('click', () => {
      const role = btn.dataset.role;
      store.set({ perspective: role });
      if (role === 'artist' && !['for-artists','artist'].includes(store.state.route.parts[0])) navigate('#/for-artists');
      if (role === 'investor' && !['marketplace','asset','portfolio','redeem'].includes(store.state.route.parts[0])) navigate('#/marketplace');
    });
  });
  const dismiss = app.querySelector('#dismissBanner');
  if (dismiss) dismiss.addEventListener('click', () => store.set({ bannerDismissed: true }));
  const themeBtn = app.querySelector('#themeToggle');
  if (themeBtn){
    themeBtn.innerHTML = currentTheme()==='dark' ? icon('sun') : icon('moon');
    themeBtn.addEventListener('click', toggleTheme);
  }
  const walletBtn = app.querySelector('#walletBtn');
  if (walletBtn) walletBtn.addEventListener('click', connectWallet);
}

function currentTheme(){
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function toggleTheme(){
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  render();
}

const marketplaceUI = { filter:'all', query:'' };

function wireDetailEvents(a){
  const app = document.getElementById('app');
  const ui = getDetailUI(a.id);
  app.querySelectorAll('.tabs [data-tab]').forEach(btn => btn.addEventListener('click', () => { ui.tab = btn.dataset.tab; render(); }));

  const remaining = a.tokensTotal - a.tokensSold;
  const qtyInput = app.querySelector('#qtyInput');
  const clampQty = v => Math.max(1, Math.min(remaining, v||1));
  const minus = app.querySelector('#qtyMinus'), plus = app.querySelector('#qtyPlus');
  if (minus) minus.addEventListener('click', () => { ui.qty = clampQty(ui.qty-1); render(); });
  if (plus) plus.addEventListener('click', () => { ui.qty = clampQty(ui.qty+1); render(); });
  if (qtyInput){
    qtyInput.addEventListener('change', () => { ui.qty = clampQty(parseInt(qtyInput.value.replace(/\D/g,''),10)); render(); });
  }
  const ack = app.querySelector('#ackCheck');
  if (ack) ack.addEventListener('change', () => { ui.ack = ack.checked; render(); });
  const buyBtn = app.querySelector('#buyBtn');
  if (buyBtn) buyBtn.addEventListener('click', () => {
    const qty = ui.qty, total = qty * a.tokenPrice;
    a.tokensSold += qty;
    store.update(s => {
      const existing = s.portfolio.holdings.find(h => h.assetId === a.id);
      if (existing){ existing.tokens += qty; existing.costBasis += total; }
      else s.portfolio.holdings.push({ assetId:a.id, tokens:qty, costBasis:total, unclaimed:0 });
    });
    ui.success = { qty, total };
    ui.qty = 1; ui.ack = false;
    render();
  });
  const scrim = app.querySelector('#successScrim');
  const closeModal = () => { ui.success = null; render(); };
  if (scrim) scrim.addEventListener('click', (e) => { if (e.target === scrim) closeModal(); });
  const closeBtn = app.querySelector('#closeModal');
  if (closeBtn) closeBtn.addEventListener('click', closeModal);
}

function wireRedeemEvents(){
  const app = document.getElementById('app');
  const connectBtn = app.querySelector('#connectWalletBtn');
  if (connectBtn) connectBtn.addEventListener('click', connectWallet);
  const disconnectBtn = app.querySelector('#disconnectWalletBtn');
  if (disconnectBtn) disconnectBtn.addEventListener('click', disconnectWallet);

  async function doRedeem(assetId){
    redeemUI.pending = assetId; render();

    if (backendAvailable){
      try {
        const result = await redeemViaBackend(assetId);
        store.update(s => { s.portfolio = result.portfolio; });
        redeemUI.pending = null;
        redeemUI.success = { amount: result.amount, txHash: result.txHash };
        render();
        return;
      } catch (err){
        console.warn('Backend redeem failed, falling back to local simulation.', err);
      }
    }

    setTimeout(() => {
      let amount = 0;
      store.update(s => {
        if (assetId === 'all'){
          s.portfolio.holdings.forEach(h => {
            if (h.unclaimed > 0){ amount += h.unclaimed; s.portfolio.distributions.push({ date:'Aug 2026', assetId:h.assetId, amount:h.unclaimed }); h.unclaimed = 0; }
          });
        } else {
          const h = s.portfolio.holdings.find(x => x.assetId === assetId);
          if (h && h.unclaimed > 0){ amount = h.unclaimed; s.portfolio.distributions.push({ date:'Aug 2026', assetId, amount:h.unclaimed }); h.unclaimed = 0; }
        }
      });
      redeemUI.pending = null;
      redeemUI.success = { amount, txHash: fakeTxHash() };
      render();
    }, 1100);
  }

  app.querySelectorAll('[data-redeem]').forEach(btn => btn.addEventListener('click', () => doRedeem(btn.dataset.redeem)));
  const redeemAllBtn = app.querySelector('#redeemAllBtn');
  if (redeemAllBtn) redeemAllBtn.addEventListener('click', () => doRedeem('all'));

  const scrim = app.querySelector('#redeemScrim');
  const closeModal = () => { redeemUI.success = null; render(); };
  if (scrim) scrim.addEventListener('click', (e) => { if (e.target === scrim) closeModal(); });
  const closeBtn = app.querySelector('#closeRedeemModal');
  if (closeBtn) closeBtn.addEventListener('click', closeModal);
}

function wireOnboardingEvents(){
  const app = document.getElementById('app');
  const w = store.state.wizard, d = w.data;

  const bind = (id, key, transform) => { const el = app.querySelector('#'+id); if (el) el.addEventListener('input', () => { d[key] = transform ? transform(el.value) : el.value; }); };
  bind('fTitle','title'); bind('fArtist','artistName'); bind('fDesc','description');
  const genre = app.querySelector('#fGenre'); if (genre) genre.addEventListener('change', () => d.genre = genre.value);

  app.querySelectorAll('[data-model]').forEach(btn => btn.addEventListener('click', () => { d.model = btn.dataset.model; render(); }));

  ['bStudio','bSession','bMix','bExtra'].forEach((id,i) => {
    const el = app.querySelector('#'+id);
    const field = ['studio','session','mix','extra'][i];
    if (el) el.addEventListener('input', () => { d.preprod[field] = Math.max(0, parseInt(el.value||'0',10)); render(); });
  });
  const cDsp = app.querySelector('#cDsp'); if (cDsp) cDsp.addEventListener('change', () => d.catalogue.dsp = cDsp.value);
  const cMonths = app.querySelector('#cMonths'); if (cMonths) cMonths.addEventListener('input', () => d.catalogue.months = cMonths.value);
  const mockUpload = app.querySelector('#mockUpload'); if (mockUpload) mockUpload.addEventListener('click', () => { d.catalogue.history = 'royalty-statement-2026.pdf'; showToast(t('toast.statementAttached'), {icon:'file'}); render(); });

  app.querySelectorAll('.seg-3').forEach(seg => {
    seg.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => { d.disclosure[seg.dataset.key] = btn.dataset.val; render(); }));
  });

  const wizAck = app.querySelector('#wizAck'); if (wizAck) wizAck.addEventListener('change', () => { d.ack = wizAck.checked; render(); });

  const back = app.querySelector('#wizBack'); if (back) back.addEventListener('click', () => { w.step = Math.max(0, w.step-1); render(); });
  const next = app.querySelector('#wizNext'); if (next) next.addEventListener('click', () => {
    if (!canAdvance(w)){ showToast(t('wizard.fillRequired'), {icon:'alert'}); return; }
    w.step = Math.min(WIZARD_STEPS.length-1, w.step+1); render();
  });
  const submit = app.querySelector('#wizSubmit'); if (submit) submit.addEventListener('click', submitCampaign);
}

function submitCampaign(){
  const d = store.state.wizard.data;
  const isPre = d.model === 'preproduction';
  const id = (d.title || 'untitled').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') + '-' + Math.floor(Math.random()*900+100);
  const total = isPre ? (d.preprod.studio+d.preprod.session+d.preprod.mix+d.preprod.extra) : 30000;

  const asset = {
    id, kind: isPre ? 'preproduction' : 'catalogue',
    title: d.title || 'Untitled campaign', artistName: d.artistName || 'Independent artist', genre: d.genre || 'Other',
    description: d.description || 'No description provided.',
    verified: false, tokenPrice: isPre ? 10 : 20,
    tokensTotal: isPre ? Math.ceil(total/10) : 1500, tokensSold: 0,
    aiDisclosure: { ...d.disclosure }, dspPolicy: 'Policy exposure to be re-checked at listing review.',
    riskFactors: ['This is a newly submitted campaign — diligence has not been completed yet.', isPre ? 'Unreleased track: no royalty history, venture-style risk.' : 'Recently submitted: limited royalty history collected so far.'],
    documents: [ isPre ? { name:'Production budget breakdown', type:'PDF', date:'Aug 2026' } : { name: d.catalogue.history || 'Royalty statement (pending)', type:'PDF', date:'Aug 2026' } ],
    status:'funding',
  };
  if (isPre){
    asset.targetRaiseUse = 'Studio time, session musicians, mix & master, release';
    asset.milestones = [
      { name:'Funding goal reached', trancheAmount: Math.round(total*0.2), status:'pending' },
      { name:'Studio & collaborators booked', trancheAmount: Math.round(total*0.4), status:'pending' },
      { name:'Mix & master delivered', trancheAmount: Math.round(total*0.3), status:'pending' },
      { name:'Release confirmed on DSPs', trancheAmount: Math.round(total*0.1), status:'pending' },
    ];
  } else {
    asset.projectedYield = 5.5;
    asset.royaltyHistory = buildRoyaltyHistory(Math.max(3,parseInt(d.catalogue.months,10)||6), 1800, 1.01, 0.18, id.length*7);
  }
  ASSETS.unshift(asset);
  store.state.campaigns.unshift({ id, assetId:id, title:asset.title, artistName:asset.artistName, holders:0, milestones: asset.milestones });

  store.state.wizard = { step:0, data:{ model:null, title:'', artistName:'', genre:'Indie Pop', description:'',
    catalogue:{ dsp:'Spotify for Artists', months:'12', history:'' },
    preprod:{ studio:5000, session:4000, mix:3000, extra:1000 },
    disclosure:{ vocals:'human', instrumentation:'human', composition:'human', postProduction:'human', lyrics:'human' },
    ack:false } };

  showToast(t('toast.campaignLaunched'), {icon:'sparkles'});
  navigate('#/artist/dashboard');
}

/* ===================================================================
   VIEW — Artist dashboard
=================================================================== */
function campaignCard(c){
  const a = assetById(c.assetId);
  if (!a) return '';
  const pct = fundingPct(a);
  return `
  <div class="card campaign-card">
    <div class="campaign-head">
      <div style="display:flex; gap:12px;">
        <div class="campaign-cover" style="${coverStyle(a.id,a.kind)}"></div>
        <div>
          <div class="asset-title" style="font-size:16px;">${a.title}</div>
          <div class="asset-artist">${a.artistName}</div>
        </div>
      </div>
      ${statusChip(a)}
    </div>
    <div>
      <div class="meter"><span style="width:${pct}%"></span></div>
      <div class="asset-meta-row" style="margin-top:6px;">
        <span>${t('asset.ofGoal', { raised: fmtUSDShort(fundingRaised(a)), goal: fmtUSDShort(fundingGoal(a)) })}</span>
        <span class="value">${pct}%</span>
      </div>
    </div>
    ${a.milestones ? milestoneTrack(a.milestones) : ''}
    <div style="display:flex; justify-content:space-between; align-items:center; padding-top:4px;">
      <span style="font-size:12.5px; color:var(--text-secondary); display:flex; align-items:center; gap:6px;">${icon('users')} ${t('campaignCard.tokenHolders', { n: c.holders })}</span>
      <a class="btn btn-secondary btn-sm" href="#/asset/${a.id}">${t('campaignCard.viewListing')} ${icon('arrowRight')}</a>
    </div>
  </div>`;
}

function renderArtistDashboard(){
  const campaigns = store.state.campaigns;
  if (!campaigns.length){
    return `
      <div class="page-head"><div><span class="page-kicker">${t('artistDash.kicker')}</span><h1>${t('artistDash.title')}</h1></div></div>
      <div class="empty-state card">${icon('music')}<h3>${t('artistDash.emptyTitle')}</h3><p>${t('artistDash.emptyBody')} <a href="#/artist/onboarding">${t('artistDash.startCampaign')}</a></p></div>`;
  }
  const totalRaised = campaigns.reduce((s,c)=>s+fundingRaised(assetById(c.assetId)),0);
  const totalHolders = campaigns.reduce((s,c)=>s+c.holders,0);
  return `
    <div class="page-head">
      <div><span class="page-kicker">${t('artistDash.kicker')}</span><h1>${t('artistDash.title')}</h1></div>
      <a class="btn btn-primary" href="#/artist/onboarding">${icon('sparkles')} ${t('artistDash.newCampaign')}</a>
    </div>
    <div class="stat-grid">
      <div class="card stat-tile"><div class="label">${t('artistDash.activeCampaigns')}</div><div class="value">${campaigns.length}</div></div>
      <div class="card stat-tile"><div class="label">${t('artistDash.totalRaised')}</div><div class="value">${fmtUSDShort(totalRaised)}</div></div>
      <div class="card stat-tile"><div class="label">${t('artistDash.tokenHolders')}</div><div class="value">${totalHolders}</div></div>
    </div>
    <div class="grid" style="grid-template-columns: repeat(auto-fill, minmax(340px,1fr));">
      ${campaigns.map(campaignCard).join('')}
    </div>
  `;
}

/* ===================================================================
   INIT
=================================================================== */
document.documentElement.lang = store.state.locale;
render();
wireWalletProviderEvents();
silentWalletSync();
hydrateFromBackend().then(() => { if (backendAvailable) render(); });
</script>
